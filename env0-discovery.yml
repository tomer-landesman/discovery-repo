environments:
  # Full example environment with all available properties
  complete-environment:
    name: "Complete Test Environment"
    projectId: "7227d03a-82c6-4afc-ab6f-97b8ed40a99e"
    templateId: "dc5dc4d3-783d-4324-9f71-5d73db491ce9"
    workspaceName: "production23123"
    variablesSets:
      - "common-variables"
      - "production-variables"
    variableFiles:
      - path: "vars/production.tfvars"
      - path: "vars/common.tfvars"
    requiresApproval: false
    isRemoteBackend: true
    autoDeployOnPathChangesOnly: true
    autoDeployByCustomGlob: "terraform/**/*.tf"
    continuousDeployment: true
    vcsPrCommentsEnabled: true
    vcsCommandsAlias: "tomer"
    pullRequestPlanDeployments: true

    driftDetectionCron: "0 */7 * * *" # Every 6 hours

  # Minimal environment with only required fields
  minimal-environment2:
    name: "Minimal Test Environment2"
    projectId: "7227d03a-82c6-4afc-ab6f-97b8ed40a99e"
    templateName: "template2"
    driftDetectionCron: "0 */6 * * *" # Every 6 hours
    ttl:
      type: "HOURS" # Options: INFINITE, HOURS, DATE
      value: "1" # Required for HOURS (stringified number) or DATE (ISO format: 2023-06-04T20:05:00.000Z)

  revision-test:
    name: "DD"
    projectId: "7227d03a-82c6-4afc-ab6f-97b8ed40a99e"
    templateName: "template2"
    revision: "kaka"

  creating-dd:
    name: "creating-dd"
    vcsCommandsAlias: "env011"
    projectId: "7227d03a-82c6-4afc-ab6f-97b8ed40a99e"
    templateName: "template2"
    driftDetectionCron: "0 */2 * * *" # Every 6 hours

